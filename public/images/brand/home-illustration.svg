<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a36"/>
      <stop offset="0.62" stop-color="#16233f"/>
      <stop offset="1" stop-color="#1d2a47"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#fde68a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243352"/>
      <stop offset="1" stop-color="#1a2743"/>
    </linearGradient>
    <radialGradient id="windowglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- evening sky -->
  <rect width="1200" height="620" fill="url(#sky)"/>
  <circle cx="980" cy="150" r="150" fill="url(#moonglow)"/>
  <circle cx="980" cy="150" r="34" fill="#fef3c7"/>
  <g fill="#ffffff">
    <circle cx="150" cy="110" r="2.4" fill-opacity="0.6"/><circle cx="320" cy="70" r="1.8" fill-opacity="0.45"/>
    <circle cx="470" cy="150" r="2" fill-opacity="0.5"/><circle cx="640" cy="90" r="1.7" fill-opacity="0.4"/>
    <circle cx="240" cy="220" r="1.6" fill-opacity="0.35"/><circle cx="750" cy="200" r="2.2" fill-opacity="0.5"/>
    <circle cx="90" cy="330" r="1.5" fill-opacity="0.3"/><circle cx="1120" cy="330" r="1.8" fill-opacity="0.4"/>
    <circle cx="550" cy="260" r="1.4" fill-opacity="0.3"/>
  </g>

  <!-- ground -->
  <rect y="600" width="1200" height="300" fill="url(#lawn)"/>
  <ellipse cx="600" cy="612" rx="700" ry="26" fill="#0e1a36" opacity="0.35"/>

  <!-- house shadow -->
  <ellipse cx="565" cy="668" rx="360" ry="30" fill="#0a0f1e" opacity="0.45"/>

  <!-- house body -->
  <g>
    <rect x="330" y="330" width="470" height="330" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="10"/>
    <!-- roof -->
    <path d="M290 345 L565 165 L840 345" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 330 L565 175 L800 330 Z" fill="#16233f"/>
    <!-- chimney -->
    <rect x="700" y="205" width="48" height="90" fill="#f8fafc" stroke="#0f172a" stroke-width="9"/>
    <!-- upstairs windows -->
    <g>
      <circle cx="430" cy="415" r="52" fill="url(#windowglow)"/>
      <rect x="398" y="383" width="64" height="64" rx="6" fill="#fbbf24" stroke="#0f172a" stroke-width="8"/>
      <path d="M430 383 v64 M398 415 h64" stroke="#0f172a" stroke-width="5"/>
      <circle cx="700" cy="415" r="52" fill="url(#windowglow)"/>
      <rect x="668" y="383" width="64" height="64" rx="6" fill="#fbbf24" stroke="#0f172a" stroke-width="8"/>
      <path d="M700 383 v64 M668 415 h64" stroke="#0f172a" stroke-width="5"/>
    </g>
    <!-- attic window -->
    <circle cx="565" cy="270" r="26" fill="#fbbf24" stroke="#0f172a" stroke-width="7"/>
    <path d="M565 244 v52 M539 270 h52" stroke="#0f172a" stroke-width="4"/>
    <!-- door with warm light: the open way in -->
    <circle cx="565" cy="565" r="85" fill="url(#windowglow)"/>
    <path d="M515 660 V545 a50 50 0 0 1 100 0 V660 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="9"/>
    <circle cx="590" cy="590" r="6" fill="#0f172a"/>
    <!-- downstairs window -->
    <rect x="668" y="530" width="80" height="70" rx="6" fill="#16233f" stroke="#0f172a" stroke-width="8"/>
    <path d="M708 530 v70 M668 565 h80" stroke="#0f172a" stroke-width="5"/>
    <rect x="382" y="530" width="80" height="70" rx="6" fill="#16233f" stroke="#0f172a" stroke-width="8"/>
    <path d="M422 530 v70 M382 565 h80" stroke="#0f172a" stroke-width="5"/>
  </g>

  <!-- amber path to the door: same motif as the logo -->
  <path d="M565 665 C 560 720, 480 760, 300 800 C 200 822, 120 850, 60 890"
        fill="none" stroke="#f59e0b" stroke-width="26" stroke-linecap="round" opacity="0.92"/>
  <path d="M565 665 C 560 720, 480 760, 300 800 C 200 822, 120 850, 60 890"
        fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 44" opacity="0.9"/>

  <!-- shrubs and tree, simple shapes -->
  <g>
    <circle cx="330" cy="640" r="34" fill="#1f3a34" stroke="#0f172a" stroke-width="7"/>
    <circle cx="812" cy="642" r="30" fill="#1f3a34" stroke="#0f172a" stroke-width="7"/>
    <rect x="1006" y="520" width="22" height="130" rx="8" fill="#0f172a"/>
    <circle cx="1018" cy="470" r="86" fill="#1f3a34" stroke="#0f172a" stroke-width="9"/>
    <circle cx="962" cy="512" r="46" fill="#254a40" stroke="#0f172a" stroke-width="7"/>
    <rect x="150" y="560" width="18" height="100" rx="7" fill="#0f172a"/>
    <circle cx="159" cy="524" r="62" fill="#1f3a34" stroke="#0f172a" stroke-width="8"/>
  </g>

  <!-- mailbox, small warm touch -->
  <g stroke="#0f172a" stroke-width="7" stroke-linecap="round">
    <path d="M885 660 V590"/>
    <rect x="862" y="556" width="70" height="38" rx="14" fill="#f59e0b"/>
  </g>
</svg>
