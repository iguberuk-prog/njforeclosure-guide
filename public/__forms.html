<!DOCTYPE html>
<html>
<head><title>Forms</title></head>
<body>
  <!-- Hidden form definitions for Netlify Forms build-time detection -->
  <form name="lead-quiz" netlify netlify-honeypot="bot-field" action="/" method="POST">
    <input type="hidden" name="form-name" value="lead-quiz" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="town" />
    <input type="text" name="propertyAddress" />
    <input type="text" name="situation" />
    <input type="text" name="timeline" />
    <input type="text" name="goal" />
    <input type="text" name="homeValue" />
    <input type="text" name="ownerType" />
    <input type="text" name="leadScore" />
    <input type="text" name="recommendation" />
    <textarea name="notes"></textarea>
    <input type="text" name="outcomeConsent" />
    <input type="text" name="propertyCondition" />
    <input type="text" name="language" />
    <input type="text" name="leadType" />
    <input type="text" name="requestOffers" />
    <input type="text" name="company" />
    <input type="text" name="propertyType" />
    <input type="text" name="loanBalance" />
    <input type="text" name="occupancy" />
    <input type="text" name="personalGuarantee" />
    <input type="text" name="campaign" />
    <input type="text" name="campaignSource" />
    <input type="text" name="campaignMedium" />
    <input type="text" name="campaignContent" />
    <input type="text" name="ghlContactId" />
    <input type="text" name="landingPage" />
    <input type="text" name="sourcePage" />
  </form>
  <form name="ai-chat-lead" netlify netlify-honeypot="bot-field" action="/" method="POST">
    <input type="hidden" name="form-name" value="ai-chat-lead" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="leadScore" />
    <textarea name="conversationSummary"></textarea>
    <input type="text" name="campaign" />
    <input type="text" name="campaignSource" />
    <input type="text" name="campaignMedium" />
    <input type="text" name="campaignContent" />
    <input type="text" name="ghlContactId" />
    <input type="text" name="landingPage" />
    <input type="text" name="sourcePage" />
  </form>
  <form name="client-review" netlify netlify-honeypot="bot-field" action="/" method="POST">
    <input type="hidden" name="form-name" value="client-review" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="lastInitial" />
    <input type="text" name="town" />
    <input type="email" name="email" />
    <input type="text" name="year" />
    <textarea name="text"></textarea>
    <input type="text" name="publishConsent" />
    <input type="text" name="sourcePage" />
  </form>
</body>
</html>
